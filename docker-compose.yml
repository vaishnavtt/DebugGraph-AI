version: "3.8"

services:
  # ============================================================================
  # PostgreSQL - Relational Database for Incidents, Investigations, & Auditing
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: debuggraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-debuggraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-debuggraph_password}
      POSTGRES_DB: ${POSTGRES_DB:-debuggraph_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-debuggraph} -d ${POSTGRES_DB:-debuggraph_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - debuggraph-network

  # ============================================================================
  # Neo4j - Graph Database for Microservice Topology & Entity Relationships
  # ============================================================================
  neo4j:
    image: neo4j:5-community
    container_name: debuggraph-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-debuggraph_neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j-admin", "database", "info"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - debuggraph-network

  # ============================================================================
  # Qdrant - Vector Database for Dense Embeddings & Vector Search
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: debuggraph-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333" # HTTP API
      - "${QDRANT_GRPC_PORT:-6334}:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - debuggraph-network

  # ============================================================================
  # Backend - FastAPI Application & Agentic RAG Pipeline
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: debuggraph-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-debuggraph}:${POSTGRES_PASSWORD:-debuggraph_password}@postgres:5432/${POSTGRES_DB:-debuggraph_db}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./backend:/app
      - ./datasets:/datasets
    networks:
      - debuggraph-network

  # ============================================================================
  # Frontend - React + TypeScript + Vite UI (Production Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: debuggraph-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - debuggraph-network

networks:
  debuggraph-network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_storage:

